name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Builds and checks the offline release, then signs a build provenance attestation for it.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # OIDC token for the Sigstore signing certificate
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: "9.0.x"

      - name: Test
        run: |
          dotnet test tests/ClaudeStatusBar.Tests -c Release
          node --test (Get-ChildItem hooks/test/*.test.js).FullName

      - name: Build the offline release zip
        run: .\build.ps1 -SelfContained -Zip

      - name: Verify it is the offline build
        run: .\tools\verify-offline.ps1 dist\ClaudeStatusBar.exe

      # sha256sum format (hash, two spaces, name, LF), so `sha256sum -c` works too.
      - name: Write SHA256SUMS.txt
        run: |
          $zip = Get-Item dist\ClaudeStatusBar-win-x64.zip
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", "$hash  $($zip.Name)`n")
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ClaudeStatusBar-win-x64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/ClaudeStatusBar-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # Only this job can write to the repository, and it runs no build code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            dist/ClaudeStatusBar-win-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
