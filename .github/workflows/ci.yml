name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [offline, online]
    env:
      OFFLINE: ${{ matrix.variant == 'offline' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build src/ClaudeStatusBar.csproj -c Release --warnaserror -p:Offline=${{ env.OFFLINE }}

      # Includes BuildVariantTests: the offline build must reference no System.Net code.
      - name: Test app
        run: dotnet test tests/ClaudeStatusBar.Tests -c Release -p:Offline=${{ env.OFFLINE }}

      # Files listed explicitly: glob arguments to --test need Node 21+.
      - name: Test hooks
        if: matrix.variant == 'offline'
        run: node --test (Get-ChildItem hooks/test/*.test.js).FullName

      # The release format: a self-contained single-file exe, checked the way a reviewer would.
      - name: Publish and verify the offline exe
        if: matrix.variant == 'offline'
        run: |
          .\build.ps1 -SelfContained
          .\tools\verify-offline.ps1 dist\ClaudeStatusBar.exe
